# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-statusy"
summary = "statuses of objects and transitions between them, with validators, actions and permissions"
solves = [
    "a workflow of an object: statuses and the allowed transitions between them",
    "validate an object and run actions on a status change",
    "who may perform which transition from which status (bazis-permit)",
    "the history of status changes",
]
requires = ["bazis", "bazis-users", "bazis-permit"]
pairs_well = ["bazis-author", "bazis-bulk"]

[[extension_points]]
name = "StatusyMixin"
import = "bazis.contrib.statusy.models_abstract.StatusyMixin"
use_when = "a model with a status and transitions"

[[extension_points]]
name = "StatusyChildMixin"
import = "bazis.contrib.statusy.models_abstract.StatusyChildMixin"
use_when = "a model whose status is the status of its parent (get_status_field)"

[[extension_points]]
name = "StatusyRouteSetBase"
import = "bazis.contrib.statusy.routes_abstract.StatusyRouteSetBase"
use_when = "every route of a StatusyMixin model: the transit endpoint and the permissions by status"

[[extension_points]]
name = "StatusySimpleRouteSetBase"
import = "bazis.contrib.statusy.routes_abstract.StatusySimpleRouteSetBase"
use_when = "the route of a StatusyChildMixin model"

[[extension_points]]
name = "transit_validator"
import = "bazis.contrib.statusy.transit_validator"
use_when = "a model method that checks a transit and raises TransitError"

[[extension_points]]
name = "transit_before"
import = "bazis.contrib.statusy.transit_before"
use_when = "a model method that runs before the status changes"

[[extension_points]]
name = "transit_after"
import = "bazis.contrib.statusy.transit_after"
use_when = "a model method that runs after the status changes"

[[extension_points]]
name = "TransitError"
import = "bazis.contrib.statusy.TransitError"
use_when = "the error a validator raises (422)"

[[extension_points]]
name = "StatusyAdminMixin"
import = "bazis.contrib.statusy.admin_abstract.StatusyAdminMixin"
use_when = "the admin of a StatusyMixin model: read-only status fields and the transit history"

[[pitfalls]]
text = "the CREATE schema accepts an initial `status`: restrict it with `add` permissions by status, or exclude it"

[[pitfalls]]
text = "a route of a StatusyMixin model that does not inherit StatusyRouteSetBase has no transits and ignores the permissions by status"
check = "statusy.W001"

[[pitfalls]]
text = "validators are also called with payload_validate_none (to build state_actions)"

[[pitfalls]]
text = "transit_apply() in code does not check the permissions of the user; a transit of another model or that does not start from the current status of the item fails with ERR_TRANSIT (400): take the transit with item.get_transit(id) (None unless it starts from the current status)"

[[pitfalls]]
text = "the user of transit_apply(transit, user) is the author of the history record and status_author: a transit the system makes (an automatic confirmation) passes None, not the user of the request"

[[pitfalls]]
text = "a transit in hook_after_create runs its validators before validate_item of the create: call `with defer_validate_item() as scope: scope.validate()` first so that an invalid item answers with the errors of its fields (the item is then validated twice: as create, then as transit)"

[[extension_points]]
name = "Workflow"
import = "bazis.contrib.statusy.declare.Workflow"
use_when = "the statuses and transits of a model declared in the WORKFLOWS of <app>/workflow.py, applied by migrate"

[[pitfalls]]
text = "a declared workflow names a StatusyMixin model, its transits go between its statuses, a transit id is unique among the models and a status has one name in all the workflows; an invalid declaration stops migrate"
check = "statusy.E001"

[[pitfalls]]
text = "the validators and actions of a declared transit are methods of the model"
check = "statusy.E002"

[[pitfalls]]
text = "a transit permission of roles.py (`<app>.<model>.item.transit.<selector>.<status>.<transit>`) names a declared transit of the model and its source status (or all)"
check = "statusy.E003"

[[pitfalls]]
text = "the names of declared statuses and transits are English gettext_lazy msgids: translate them in the catalogs of the project"
check = "statusy.W002"

[[pitfalls]]
text = "the declared workflows reach the database only by migrate (or flush): after a change of workflow.py run migrate; `manage.py check --database default` lists the differences"
check = "statusy.W003"

[[pitfalls]]
text = "a transit removed from workflow.py is kept (its history references it, deleting it deletes the history): delete it in the admin if it must go"
check = "statusy.W004"
