# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-statusy"
summary = "statuses of objects and transitions between them, with validators, actions and permissions"
solves = [
    "a workflow of an object: statuses and the allowed transitions between them",
    "validate an object and run actions on a status change",
    "who may perform which transition from which status (bazis-permit)",
    "the history of status changes",
]
requires = ["bazis", "bazis-users", "bazis-permit"]
pairs_well = ["bazis-author", "bazis-bulk"]

[[extension_points]]
name = "StatusyMixin"
import = "bazis.contrib.statusy.models_abstract.StatusyMixin"
use_when = "a model with a status and transitions"

[[extension_points]]
name = "StatusyMixin.status_history"
import = "bazis.contrib.statusy.models_abstract.StatusyMixin"
use_when = "show the history of the transits of an item in the API: include={'status_history': None}"

[[extension_points]]
name = "StatusyChildMixin"
import = "bazis.contrib.statusy.models_abstract.StatusyChildMixin"
use_when = "a model whose status is the status of its parent (get_status_field)"

[[extension_points]]
name = "StatusyRouteSetBase"
import = "bazis.contrib.statusy.routes_abstract.StatusyRouteSetBase"
use_when = "every route of a StatusyMixin model: the transit endpoint and the permissions by status"

[[extension_points]]
name = "StatusySimpleRouteSetBase"
import = "bazis.contrib.statusy.routes_abstract.StatusySimpleRouteSetBase"
use_when = "the route of a StatusyChildMixin model"

[[extension_points]]
name = "transit_validator"
import = "bazis.contrib.statusy.transit_validator"
use_when = "a model method that checks a transit and raises TransitError"

[[extension_points]]
name = "transit_before"
import = "bazis.contrib.statusy.transit_before"
use_when = "a model method that runs before the status changes"

[[extension_points]]
name = "transit_after"
import = "bazis.contrib.statusy.transit_after"
use_when = "a model method that runs after the status changes"

[[extension_points]]
name = "TransitError"
import = "bazis.contrib.statusy.TransitError"
use_when = "the error a validator raises (422)"

[[extension_points]]
name = "StatusyAdminMixin"
import = "bazis.contrib.statusy.admin_abstract.StatusyAdminMixin"
use_when = "the admin of a StatusyMixin model: read-only status fields and the transit history"

[[extension_points]]
name = "Workflow"
import = "bazis.contrib.statusy.declare.Workflow"
use_when = "the statuses and transits of a model declared in the WORKFLOWS of <app>/workflow.py, applied by migrate; initial= the status of its new objects"

[[pitfalls]]
text = "the CREATE schema accepts an initial `status`: restrict it with `add` permissions by status, or exclude it"

[[pitfalls]]
text = "a route of a StatusyMixin model that does not inherit StatusyRouteSetBase has no transits and ignores the permissions by status"
check = "statusy.W001"

[[pitfalls]]
text = "validators are also called with payload_validate_none (to build state_actions): return before reading the payload"

[[pitfalls]]
text = "a transit of the parent validates its StatusyChildMixin children; it needs only the transit permission of the parent"

[[pitfalls]]
text = "the payload of a transit is one object with the fields of the payload models of all its validators and actions"

[[pitfalls]]
text = "titles of payload fields stay lazy: Field(title=gettext_lazy(...)), never str()"

[[pitfalls]]
text = "transit_apply() in code checks no permissions and makes only a transit from the current status: take it with item.get_transit(id)"

[[pitfalls]]
text = "a transit the system makes passes user None to transit_apply, not the user of the request"

[[pitfalls]]
text = "a transit in hook_after_create runs its validators before validate_item: validate the new item first with defer_validate_item"

[[pitfalls]]
text = "an invalid declaration of workflow.py stops migrate (a StatusyMixin model, transits between its statuses, unique transit ids, one name per status, an initial status of the workflow)"
check = "statusy.E001"

[[pitfalls]]
text = "the validators and actions of a declared transit are methods of the model"
check = "statusy.E002"

[[pitfalls]]
text = "a permission of roles.py on a model with a declared workflow names its statuses and declared transits"
check = "statusy.E003"

[[pitfalls]]
text = "the names of declared statuses and transits are English gettext_lazy msgids translated by the catalogs of the project"

[[pitfalls]]
text = "the initial status of a model is Workflow(initial=...), not the global BS_BAZIS_STATUS_INITIAL"
check = "statusy.E001"

[[pitfalls]]
text = "anonymous users get 403 on the transit endpoint: a transit for them is a route of its own with route_declare(..., public=True)"

[[pitfalls]]
text = "the declared workflows reach the database only by migrate"
check = "statusy.W003"

[[pitfalls]]
text = "a transit removed from workflow.py is kept (its history references it)"
check = "statusy.W004"

[[pitfalls]]
text = "a declared transit id that is a transit of another model stops migrate"
check = "statusy.E004"

[[pitfalls]]
text = "on a fresh database a data migration cannot rely on the declared statuses or transits"
